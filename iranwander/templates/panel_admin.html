<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Panel</title>

    <!-- Load CSS from Flask static folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/panel_admin.css') }}">
</head>

<body>
    <div class="container">
        <h1 class="title">Admin Panel</h1>

        <!-- User Info Section -->
        <section class="card">
            <h2>User Information</h2>
            <div class="info">
                <p><strong>Name:</strong> {{ user.name }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Password:</strong> ******</p>
            </div>
        </section>

        <!-- Change Password Section -->
        <section class="card">
            <h2>Change Password</h2>
            <form class="password-form" method="POST" action="/change_password">
                <label>New Password:</label>
                <input type="password" name="new_password" placeholder="Enter new password">

                <label>Confirm New Password:</label>
                <input type="password" name="confirm_password" placeholder="Re-enter new password">

                <button type="submit">Update Password</button>
            </form>
        </section>

        <!-- Liked Places Section -->
        <section class="card">
            <h2>Liked Places</h2>
            <ul class="liked-list">
                {% for place in liked %}
                <li>{{ place }}</li>
                {% endfor %}
            </ul>
        </section>
    </div>
</body>

</html>
