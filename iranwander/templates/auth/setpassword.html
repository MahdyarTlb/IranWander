{% extends "base.html" %}

{% block title %}Set New Password | {{ super() }}{% endblock %}

{% block extra_css %}
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/setpassword.css') }}">
{% endblock %}

{% block content %}
<form method="POST" action="{{ url_for('auth.set_password', token=token) }}">
    <fieldset class="set-password">
        <div class="svg">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" color="white" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
        </div>
        <div class="title-forget">
            <p><b>Change Password</b></p>
        </div>
        <div class="text">
            <p>" Please set your new password "</p>
        </div>

        <div class="inputs">
            <div class="input-group">
                <input required="" type="password" name="new_password" autocomplete="off" class="input">
                <label class="user-label">New Password</label>
            </div>
            <div class="input-group">
                <input required="" type="password" name="confirm_password" autocomplete="off" class="input">
                <label class="user-label">Confirm New Password</label>
            </div>
        </div>
        <div class="button-set-password">
            <input type="submit" value="Set Password">
        </div>
    </fieldset>
</form>
{% endblock content %}
